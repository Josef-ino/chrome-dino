  <!-- ====== WEB SERIAL — PŘIPOJENÍ NA ARDUINO ====== -->
  <script>
  (function () {
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusEl = document.getElementById('serialStatus');
    const lastLineEl = document.getElementById('serialLastLine');

    let port = null;
    let reader = null;
    let keepReading = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    // Simuluje stisk mezerníku / šipky nahoru, na které originální hra reaguje
    function triggerJump() {
      const downEvent = new KeyboardEvent('keydown', {
        key: ' ',
        code: 'Space',
        keyCode: 32,
        which: 32,
        bubbles: true
      });
      const upEvent = new KeyboardEvent('keyup', {
        key: ' ',
        code: 'Space',
        keyCode: 32,
        which: 32,
        bubbles: true
      });
      document.dispatchEvent(downEvent);
      setTimeout(() => document.dispatchEvent(upEvent), 50);
    }

    async function connectArduino() {
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });

        setStatus('Připojeno');
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        keepReading = true;

        const decoder = new TextDecoderStream();
        const readableStreamClosed = port.readable.pipeTo(decoder.writable);
        reader = decoder.readable.getReader();

        readLoop(readableStreamClosed);
      } catch (err) {
        console.error(err);
        setStatus('Chyba připojení');
      }
    }

    async function readLoop(readableStreamClosed) {
      let buffer = '';

      try {
        while (keepReading) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) {
            buffer += value;
            const lines = buffer.split(/\r?\n/);
            buffer = lines.pop();

            for (const line of lines) {
              handleArduinoLine(line.trim());
            }
          }
        }
      } catch (err) {
        console.error(err);
      } finally {
        try { reader.releaseLock(); } catch (e) {}
        try { await readableStreamClosed; } catch (e) {}
      }
    }

    function handleArduinoLine(line) {
      if (!line) return;
      lastLineEl.textContent = line;

      const l = line.toUpperCase();

      // Reaguje na tvoje IR výstupy nebo vlastní texty z Arduina
      if (
        l.includes('JUMP') ||
        l.includes('UP') ||
        l.includes('OK') ||
        l.includes('SIPKA NAHORU') ||
        l.includes('COMMAND=0X14') ||
        l.includes('COMMAND=0X35')
      ) {
        triggerJump();
      }
    }

    async function disconnectArduino() {
      keepReading = false;
      try {
        if (reader) {
          await reader.cancel();
          reader = null;
        }
      } catch (e) {}
      try {
        if (port) {
          await port.close();
          port = null;
        }
      } catch (e) {}

      setStatus('Nepřipojeno');
      connectBtn.disabled = false;
      disconnectBtn.disabled = true;
    }

    connectBtn.addEventListener('click', connectArduino);
    disconnectBtn.addEventListener('click', disconnectArduino);

    if (!('serial' in navigator)) {
      setStatus('Web Serial není podporován (použij Chrome/Edge)');
      connectBtn.disabled = true;
    }
  })();
  </script>
