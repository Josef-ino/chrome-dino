<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Dino - Arduino</title>

  <style>
    :root {
      --background: #f7f7f7;
      --foreground: #535353;
      --button-blue: #1a73e8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--foreground);
      font-family: Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    #arduinoBar {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 7px 12px;
      background: white;
      border-bottom: 1px solid #ddd;
      font-size: 13px;
    }

    #arduinoBar button {
      border: 0;
      border-radius: 18px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
    }

    #connectButton {
      color: white;
      background: var(--button-blue);
    }

    #connectButton:hover {
      background: #155fc0;
    }

    #disconnectButton {
      color: #696969;
      background: #d9d9d9;
    }

    #arduinoBar button:disabled {
      cursor: default;
      opacity: 0.6;
    }

    #serialStatus {
      font-weight: bold;
    }

    #lastSerialLine {
      max-width: 45vw;
      overflow: hidden;
      color: #888;
      font-family: monospace;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #gameContainer {
      width: min(800px, 100%);
      margin: 0 auto;
      padding: 105px 20px 40px;
      text-align: center;
    }

    #gameTitle {
      height: 38px;
      font-size: 24px;
      font-weight: normal;
    }

    #gameCanvas {
      display: block;
      width: 600px;
      height: 150px;
      max-width: 100%;
      margin: 0 auto;
      background: var(--background);
      image-rendering: pixelated;
    }

    #instructions {
      margin-top: 24px;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    kbd {
      padding: 2px 6px;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: white;
      font-family: monospace;
    }

    @media (max-width: 600px) {
      #arduinoBar {
        flex-wrap: wrap;
      }

      #gameContainer {
        padding-top: 135px;
      }

      #gameTitle {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <div id="arduinoBar">
    <button id="connectButton">Připojit Arduino</button>
    <button id="disconnectButton" disabled>Odpojit</button>

    <span>Stav:</span>
    <span id="serialStatus">Nepřipojeno</span>
    <span id="lastSerialLine"></span>
  </div>

  <main id="gameContainer">
    <div id="gameTitle">Mezerníkem spustíte hru</div>

    <canvas id="gameCanvas" width="600" height="150"></canvas>

    <div id="instructions">
      <div>
        <kbd>Mezerník</kbd> nebo <kbd>↑</kbd> = skok
      </div>
      <div>
        Arduino: šipka nahoru nebo tlačítko OK = skok
      </div>
    </div>
  </main>

  <script>
    "use strict";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const title = document.getElementById("gameTitle");
    const connectButton = document.getElementById("connectButton");
    const disconnectButton = document.getElementById("disconnectButton");
    const serialStatus = document.getElementById("serialStatus");
    const lastSerialLine = document.getElementById("lastSerialLine");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const GROUND_Y = 124;

    let running = false;
    let gameOver = false;
    let score = 0;
    let highScore = Number(localStorage.getItem("dinoHighScore") || 0);
    let speed = 5;
    let lastFrameTime = 0;
    let obstacleTimer = 0;
    let nextObstacleTime = 1100;
    let groundOffset = 0;

    const dino = {
      x: 55,
      y: GROUND_Y - 43,
      width: 44,
      height: 43,
      velocityY: 0,
      gravity: 0.62,
      jumpPower: -11,
      jumping: false,
      animationTimer: 0,
      animationFrame: 0
    };

    let obstacles = [];

    const clouds = [
      { x: 90, y: 30, speed: 0.18 },
      { x: 375, y: 18, speed: 0.13 },
      { x: 540, y: 48, speed: 0.16 }
    ];

    function setTitle(text) {
      title.textContent = text;
    }

    function resetGame() {
      running = false;
      gameOver = false;
      score = 0;
      speed = 5;
      obstacleTimer = 0;
      nextObstacleTime = 1100;
      obstacles = [];

      dino.y = GROUND_Y - dino.height;
      dino.velocityY = 0;
      dino.jumping = false;

      setTitle("Mezerníkem spustíte hru");
    }

    function startGame() {
      if (gameOver) {
        resetGame();
      }

      running = true;
      gameOver = false;
      setTitle("");
    }

    function jump() {
      if (gameOver) {
        resetGame();
        startGame();
      }

      if (!running) {
        startGame();
      }

      if (!dino.jumping) {
        dino.velocityY = dino.jumpPower;
        dino.jumping = true;
      }
    }

    function drawCloud(cloud) {
      ctx.fillStyle = "#d8d8d8";

      ctx.fillRect(cloud.x, cloud.y + 7, 42, 5);
      ctx.fillRect(cloud.x + 7, cloud.y + 3, 23, 8);
      ctx.fillRect(cloud.x + 16, cloud.y, 15, 12);
      ctx.fillRect(cloud.x + 29, cloud.y + 5, 14, 7);
    }

    function drawDino() {
      const x = Math.round(dino.x);
      const y = Math.round(dino.y);

      ctx.fillStyle = "#535353";

      // ocas
      ctx.fillRect(x + 1, y + 20, 12, 7);
      ctx.fillRect(x - 3, y + 25, 9, 5);

      // tělo
      ctx.fillRect(x + 10, y + 13, 25, 22);

      // krk
      ctx.fillRect(x + 21, y + 6, 10, 18);

      // hlava
      ctx.fillRect(x + 26, y + 2, 16, 18);
      ctx.fillRect(x + 37, y + 10, 8, 8);

      // zadní noha
      if (dino.animationFrame === 0) {
        ctx.fillRect(x + 12, y + 31, 7, 12);
        ctx.fillRect(x + 8, y + 40, 11, 3);
      } else {
        ctx.fillRect(x + 16, y + 31, 7, 12);
        ctx.fillRect(x + 18, y + 40, 11, 3);
      }

      // přední noha
      ctx.fillRect(x + 29, y + 31, 7, 12);
      ctx.fillRect(x + 33, y + 40, 10, 3);

      // oko
      ctx.fillStyle = "#f7f7f7";
      ctx.fillRect(x + 37, y + 6, 3, 3);
    }

    function drawCactus(obstacle) {
      const x = Math.round(obstacle.x);
      const y = Math.round(obstacle.y);
      const h = obstacle.height;

      ctx.fillStyle = "#535353";

      // hlavní stonek
      ctx.fillRect(x + 8, y, 9, h);

      // horní část
      ctx.fillRect(x + 5, y, 15, 5);

      // levá větev
      if (h > 28) {
        ctx.fillRect(x + 1, y + 12, 7, 6);
        ctx.fillRect(x + 1, y + 12, 5, 16);
      }

      // pravá větev
      if (h > 34) {
        ctx.fillRect(x + 17, y + 20, 8, 6);
        ctx.fillRect(x + 20, y + 20, 5, 15);
      }
    }

    function spawnCactus() {
      const height = 28 + Math.floor(Math.random() * 22);
      const width = 25;

      obstacles.push({
        x: WIDTH + 10,
        y: GROUND_Y - height,
        width,
        height
      });
    }

    function drawGround() {
      ctx.strokeStyle = "#535353";
      ctx.lineWidth = 1;

      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(WIDTH, GROUND_Y);
      ctx.stroke();

      ctx.fillStyle = "#888";

      for (let x = -40; x < WIDTH + 40; x += 45) {
        const lineX = x - groundOffset;
        ctx.fillRect(lineX, GROUND_Y + 7, 17, 1);
      }
    }

    function drawScore() {
      ctx.fillStyle = "#535353";
      ctx.font = "14px monospace";
      ctx.textAlign = "right";

      const current = String(score).padStart(5, "0");
      const best = String(highScore).padStart(5, "0");

      ctx.fillText("HI " + best + "  " + current, WIDTH - 12, 19);
      ctx.textAlign = "left";
    }

    function intersects(a, b) {
      const padding = 5;

      return (
        a.x + padding < b.x + b.width &&
        a.x + a.width - padding > b.x &&
        a.y + padding < b.y + b.height &&
        a.y + a.height - padding > b.y
      );
    }

    function update(delta) {
      if (!running || gameOver) {
        return;
      }

      const factor = delta / 16.67;

      // pohyb dinosaura
      dino.velocityY += dino.gravity * factor;
      dino.y += dino.velocityY * factor;

      if (dino.y >= GROUND_Y - dino.height) {
        dino.y = GROUND_Y - dino.height;
        dino.velocityY = 0;
        dino.jumping = false;
      }

      // animace nohou
      dino.animationTimer += delta;

      if (dino.animationTimer > 110) {
        dino.animationTimer = 0;
        dino.animationFrame = dino.animationFrame === 0 ? 1 : 0;
      }

      // posun země
      groundOffset += speed * factor;

      if (groundOffset > 45) {
        groundOffset -= 45;
      }

      // pohyb mraků
      for (const cloud of clouds) {
        cloud.x -= cloud.speed * factor;

        if (cloud.x < -60) {
          cloud.x = WIDTH + Math.random() * 100;
        }
      }

      // tvorba kaktusů
      obstacleTimer += delta;

      if (obstacleTimer >= nextObstacleTime) {
        spawnCactus();
        obstacleTimer = 0;
        nextObstacleTime = 900 + Math.random() * 900;
      }

      speed += 0.0015 * factor;

      // pohyb kaktusů
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obstacle = obstacles[i];

        obstacle.x -= speed * factor;

        if (obstacle.x + obstacle.width < 0) {
          obstacles.splice(i, 1);
          score++;

          if (score > highScore) {
            highScore = score;
            localStorage.setItem("dinoHighScore", highScore);
          }

          continue;
        }

        if (intersects(dino, obstacle)) {
          running = false;
          gameOver = true;
          setTitle("Konec hry - stiskni OK nebo mezerník");
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = "#f7f7f7";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      for (const cloud of clouds) {
        drawCloud(cloud);
      }

      drawGround();

      for (const obstacle of obstacles) {
        drawCactus(obstacle);
      }

      drawDino();
      drawScore();

      if (!running && !gameOver) {
        ctx.fillStyle = "#535353";
        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
          "Stiskni mezerník, šipku nahoru nebo tlačítko OK",
          WIDTH / 2,
          90
        );
        ctx.textAlign = "left";
      }
    }

    function gameLoop(time) {
      if (!lastFrameTime) {
        lastFrameTime = time;
      }

      const delta = Math.min(time - lastFrameTime, 50);
      lastFrameTime = time;

      update(delta);
      draw();

      requestAnimationFrame(gameLoop);
    }

    /*
     * Klávesnice
     */
    document.addEventListener("keydown", function (event) {
      if (
        event.code === "Space" ||
        event.code === "ArrowUp" ||
        event.keyCode === 32 ||
        event.keyCode === 38
      ) {
        event.preventDefault();
        jump();
      }
    });

    /*
     * Web Serial
     */
    let port = null;
    let reader = null;
    let keepReading = false;
    let readableStreamClosed = null;

    function setSerialStatus(text) {
      serialStatus.textContent = text;
    }

    function handleSerialLine(line) {
      if (!line) {
        return;
      }

      lastSerialLine.textContent = " | " + line;

      const text = line.toUpperCase();

      /*
       * Webová hra reaguje na:
       * JUMP
       * UP
       * OK
       * SIPKA NAHORU
       * COMMAND=0X14
       * COMMAND=0X35
       */
      if (
        text === "JUMP" ||
        text === "UP" ||
        text === "OK" ||
        text.includes("SIPKA NAHORU") ||
        text.includes("COMMAND=0X14") ||
        text.includes("COMMAND=0X35")
      ) {
        jump();
      }
    }

    async function readSerial() {
      let buffer = "";

      try {
        while (keepReading && reader) {
          const result = await reader.read();

          if (result.done) {
            break;
          }

          if (!result.value) {
            continue;
          }

          buffer += result.value;

          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop();

          for (const line of lines) {
            handleSerialLine(line.trim());
          }
        }
      } catch (error) {
        if (keepReading) {
          console.error(error);
          setSerialStatus("Chyba čtení");
        }
      }
    }

    async function connectArduino() {
      if (!("serial" in navigator)) {
        setSerialStatus("Použij Chrome nebo Edge");
        return;
      }

      try {
        setSerialStatus("Vyber Arduino...");

        port = await navigator.serial.requestPort();

        setSerialStatus("Připojování...");

        await port.open({
          baudRate: 9600
        });

        keepReading = true;

        connectButton.disabled = true;
        disconnectButton.disabled = false;

        setSerialStatus("Připojeno");

        const decoder = new TextDecoderStream();

        readableStreamClosed = port.readable.pipeTo(decoder.writable);
        reader = decoder.readable.getReader();

        readSerial();
      } catch (error) {
        console.error("Web Serial chyba:", error);

        connectButton.disabled = false;
        disconnectButton.disabled = true;

        if (error && error.name === "AbortError") {
          setSerialStatus("Nepřipojeno");
        } else {
          setSerialStatus("Připojení se nepodařilo");
        }
      }
    }

    async function disconnectArduino() {
      keepReading = false;

      try {
        if (reader) {
          await reader.cancel();
          reader.releaseLock();
        }
      } catch (error) {
        console.warn(error);
      }

      try {
        if (readableStreamClosed) {
          await readableStreamClosed.catch(function () {});
        }
      } catch (error) {
        console.warn(error);
      }

      try {
        if (port) {
          await port.close();
        }
      } catch (error) {
        console.warn(error);
      }

      reader = null;
      port = null;
      readableStreamClosed = null;

      connectButton.disabled = false;
      disconnectButton.disabled = true;

      setSerialStatus("Nepřipojeno");
      lastSerialLine.textContent = "";
    }

    connectButton.addEventListener("click", connectArduino);
    disconnectButton.addEventListener("click", disconnectArduino);

    if (!("serial" in navigator)) {
      connectButton.disabled = true;
      setSerialStatus("Použij Chrome nebo Edge");
    }

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
